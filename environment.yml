name: clinical-prediction
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.9
  
  # Core data science libraries
  - pandas>=1.5.0
  - numpy>=1.21.0
  - scikit-learn>=1.1.0
  
  # Data visualization
  - matplotlib>=3.5.0
  - seaborn>=0.11.0
  - plotly>=5.0.0
  
  # Jupyter environment
  - jupyter>=1.0.0
  - jupyterlab>=3.0.0
  - ipykernel
  
  # Development tools
  - pytest>=7.0.0
  - flake8>=5.0.0
  - black>=22.0.0
  - mypy>=0.991
  
  # Other utilities
  - pyyaml>=6.0
  - tqdm
  
  # Packages installed via pip
  - pip
  - pip:
    - joblib>=1.2.0
    - pytest-cov>=4.0.0
    - sphinx>=5.0.0
    - sphinx-rtd-theme>=1.0.0
    # Translation dependencies
    - requests>=2.28.0
    - openai>=1.0.0
    - google-cloud-translate>=3.0.0
    - deepl>=1.0.0
